<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>One-Pager · Schattingsaanvraag tijdlijn · Lead it, Grow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background:#0e0d0b; display:flex; flex-direction:column; align-items:center; gap:16px; padding:40px 20px 60px; font-family:'Space Grotesk',sans-serif; }
    .page-label { display:none; color:#787068; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; font-family:'Space Mono',monospace; }
    .card { width:1080px; height:1080px; position:relative; overflow:hidden; flex-shrink:0; background:#0e0d0b; border-radius:0; }
    .top-bar { position:absolute; top:0; left:0; right:0; height:6px; background:#c96442; }
    .content { position:absolute; inset:0; padding:72px 80px 68px; display:flex; flex-direction:column; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand-dot { width:12px; height:12px; background:#c96442; }
    .brand-word { font-family:'Space Mono',monospace; font-size:15px; letter-spacing:0.18em; text-transform:uppercase; color:#f2f0eb; }
    .timeline { display:flex; flex-direction:column; gap:0; }
    .entry { display:flex; flex-direction:column; gap:18px; padding:44px 0; border-bottom:1px solid #2a2924; }
    .entry:first-child { padding-top:0; }
    .entry:last-child { border-bottom:none; padding-bottom:0; }
    .time-row { display:flex; align-items:center; gap:26px; }
    .time { font-family:'Space Mono',monospace; font-weight:700; font-size:104px; line-height:0.9; color:#535146; letter-spacing:-0.03em; }
    .entry.done .time { color:#c96442; }
    .status-pill { font-family:'Space Mono',monospace; font-size:13px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#0e0d0b; background:#4ade80; padding:8px 16px; width:fit-content; }
    .status-pill.waiting { background:transparent; color:#787068; border:1px solid #3a3833; }
    .entry-text { font-size:46px; font-weight:600; line-height:1.2; color:#787068; letter-spacing:-0.02em; max-width:900px; }
    .entry.done .entry-text { color:#f2f0eb; }
    .bottom { display:flex; flex-direction:column; gap:18px; padding-top:38px; border-top:3px solid #c96442; }
    .bottom-eyebrow { font-family:'Space Mono',monospace; font-size:13px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:#c96442; }
    .bottom-line { font-size:34px; font-weight:600; line-height:1.3; color:#f2f0eb; max-width:880px; letter-spacing:-0.01em; }
    .bottom-line strong { color:#4ade80; font-weight:700; }
  </style>
</head>
<body>
  <p class="page-label">LinkedIn Afbeelding · 1080 × 1080px · Lead it, Grow</p>

  <div class="card">
    <div class="top-bar"></div>
    <div class="content">
      <div class="brand">
        <div class="brand-dot"></div>
        <div class="brand-word">Lead it, Grow</div>
      </div>

      <div class="timeline">
        <div class="entry">
          <div class="time-row">
            <div class="time">21:45</div>
            <div class="status-pill waiting">Nieuwe aanvraag</div>
          </div>
          <div class="entry-text">Er komt een nieuwe schattingsaanvraag binnen.</div>
        </div>
        <div class="entry done">
          <div class="time-row">
            <div class="time">21:48</div>
            <div class="status-pill">Beantwoord</div>
          </div>
          <div class="entry-text">De mail is al beantwoord.</div>
        </div>
      </div>

      <div class="bottom">
        <div class="bottom-eyebrow">Speed-to-lead</div>
        <div class="bottom-line"><strong>3 minuten.</strong> Zonder dat jij het zag. Zonder dat jij iets deed.</div>
      </div>
    </div>
  </div>
</body>
</html>
